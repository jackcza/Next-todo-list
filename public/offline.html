<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#6366f1" />
    <title>Offline · Todo List</title>
    <!-- Served by the service worker when the network is down, so it must not depend on other files. -->
    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 0 16px;
        background: linear-gradient(135deg, #eef2ff 0%, #f5f3ff 50%, #fdf2f8 100%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      .card {
        box-sizing: border-box;
        width: 100%;
        max-width: 420px;
        padding: 40px 32px;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 20px 50px -12px rgba(79, 70, 229, 0.18);
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 26px;
        background: linear-gradient(90deg, #6366f1, #a855f7);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p {
        margin: 0 0 24px;
        color: #64748b;
        font-size: 15px;
        line-height: 1.6;
      }
      button {
        padding: 10px 28px;
        border: none;
        border-radius: 10px;
        background: #6366f1;
        color: #fff;
        font-size: 15px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>Your tasks are saved online. Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
