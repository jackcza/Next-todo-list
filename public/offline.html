<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#6366f1" />
    <title>Offline · Todo List</title>
    <!-- Served by the service worker when the network is down, so it must not depend on other files. -->
    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 0 16px;
        background: linear-gradient(135deg, #eef2ff 0%, #f5f3ff 50%, #fdf2f8 100%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      .card {
        box-sizing: border-box;
        width: 100%;
        max-width: 420px;
        padding: 40px 32px;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 20px 50px -12px rgba(79, 70, 229, 0.18);
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 26px;
        background: linear-gradient(90deg, #6366f1, #a855f7);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p {
        margin: 0 0 24px;
        color: #64748b;
        font-size: 15px;
        line-height: 1.6;
      }
      a,
      button {
        display: inline-block;
        margin: 0 4px;
        padding: 10px 28px;
        border: none;
        border-radius: 10px;
        background: #6366f1;
        color: #fff;
        font-size: 15px;
        text-decoration: none;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1 id="title">You're offline</h1>
      <p id="text">
        This page needs a connection. Your task list works offline once you have opened it online on this device.
      </p>
      <a id="home" href="/">My tasks</a>
      <button id="retry" type="button" onclick="location.reload()">Try again</button>
    </div>
    <script>
      // Same preference the app stores (see lib/i18n.ts), falling back to the browser language.
      var saved = (document.cookie.match(/(?:^|; )lang=(\w+)/) || [])[1];
      var lang = saved || (/^zh/i.test(navigator.language) ? "zh" : "en");
      if (lang === "zh") {
        document.documentElement.lang = "zh-CN";
        document.title = "离线 · 待办清单";
        document.getElementById("title").textContent = "当前处于离线状态";
        document.getElementById("text").textContent =
          "这个页面需要联网。只要在这台设备上联网打开过任务列表，之后离线也能使用。";
        document.getElementById("home").textContent = "我的任务";
        document.getElementById("retry").textContent = "重试";
      }
    </script>
  </body>
</html>
