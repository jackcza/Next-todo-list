<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>怎么用 Todo List</title>
    <style>
      * { box-sizing: border-box; }
      body {

        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 12px;
        background: linear-gradient(135deg, #eef2ff 0%, #f5f3ff 50%, #fdf2f8 100%);

        color: #1e293b;
      }
      .wrap { width: 100%; max-width: 420px; }
      .lang { display: flex; justify-content: flex-end; margin-bottom: 10px; }
      .lang-inner { display: inline-flex; padding: 2px; border-radius: 8px; background: #f5f5f5; }
      .lang button {
        height: 20px;
        padding: 0 7px;

        border-radius: 6px;
        background: none;

      h1 {
        margin: 0 0 14px;
        text-align: center;
        font-size: 22px;
        background: linear-gradient(90deg, #6366f1, #a855f7);

        background-clip: text;
        color: transparent;

      .cta { display: flex; justify-content: center; align-items: center; gap: 14px; margin: -4px 0 22px; }

        border-radius: 999px;
        background: linear-gradient(90deg, #6366f1, #a855f7);

      .cta-login { color: #6366f1; font-size: 13px; text-decoration: none; }
      .cta-login:hover { text-decoration: underline; }
      .stage { position: relative; }
      /* The demo card mirrors app/globals.css at phone width, plus the antd components it uses. */
      .ai { display: inline-block; flex-shrink: 0; width: 1em; height: 1em; vertical-align: -0.125em; fill: currentColor; }
      .card {
        padding: 32px 24px;
        border-radius: 20px;

      .app-title {
        font-size: 28px;
        font-weight: 700;
        line-height: 1.3;
        background: linear-gradient(90deg, #6366f1, #a855f7);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .app-sub { margin: 6px 0 0; font-size: 14px; color: #94a3b8; }
      .account {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 4px;
        margin-top: 8px;
        font-size: 13px;
        color: #64748b;
      }
      .tbtn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 24px;
        padding: 0 7px;
        border-radius: 8px;
        color: rgba(0, 0, 0, 0.88);
        font-size: 14px;
        white-space: nowrap;
        transition: background 0.2s;
      }
      .tbtn.hot { background: rgba(0, 0, 0, 0.06); }

      .tbtn.square { justify-content: center; width: 24px; padding: 0; }
      .tip {
        margin: -6px 0 16px;

        background: #fffbeb;
        color: #92400e;
        font-size: 13px;
        line-height: 1.6;
      }
      .tip .ai { color: #f59e0b; }
      .input-row { display: flex; gap: 10px; margin-bottom: 16px; }
      .input-row input {
        flex: 1;
        min-width: 0;
        height: 40px;
        padding: 7px 11px;
        border: 1px solid #d9d9d9;
        border-radius: 10px;
        outline: none;
        color: rgba(0, 0, 0, 0.88);
        font: inherit;
        font-size: 16px;
      }
      .input-row input::placeholder { color: rgba(0, 0, 0, 0.25); }
      .input-row button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 40px;
        padding: 0 15px;
        border: 1px solid transparent;
        border-radius: 10px;
        background: #6366f1;
        box-shadow: 0 2px 0 rgba(99, 102, 241, 0.1);
        color: #fff;
        font: inherit;
        font-size: 16px;
      }
      .input-row button:disabled { border-color: #d9d9d9; background: rgba(0, 0, 0, 0.04); box-shadow: none; color: rgba(0, 0, 0, 0.25); }
      .tabs { display: flex; margin-bottom: 16px; padding: 2px; border-radius: 10px; background: #f5f5f5; }
      .tabs button {
        flex: 1;
        min-width: 0;
        height: 28px;
        padding: 0 11px;
        border: none;
        border-radius: 8px;
        background: transparent;
        color: rgba(0, 0, 0, 0.65);
        font: inherit;
        font-size: 14px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tabs button.on {
        background: #fff;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03), 0 1px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px rgba(0, 0, 0, 0.02);
        color: rgba(0, 0, 0, 0.88);
      }
      .groups { display: flex; flex-direction: column; gap: 14px; }
      .day {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        margin-bottom: 8px;
        padding: 0 4px;
        border: none;
        background: none;
        color: #334155;
        font: inherit;
        text-align: left;
      }
      .day-arrow { font-size: 11px; color: #94a3b8; transition: transform 0.2s; }
      .day-arrow.open { transform: rotate(90deg); }
      .day-label { font-size: 14px; font-weight: 600; }
      .day-detail { font-size: 13px; color: #94a3b8; }
      .day-count {
        margin-left: auto;
        min-width: 20px;
        padding: 0 7px;
        border-radius: 10px;
        background: #eef2ff;
        color: #6366f1;
        font-size: 12px;
        line-height: 20px;
        text-align: center;
      }
      .list {
        margin: 0;
        padding: 0;
        list-style: none;
        border: 1px solid #eef0f5;
        border-radius: 14px;
        overflow: hidden;
      }
      .list li {
        padding: 12px;
        border-bottom: 1px solid #f1f3f8;
        background: #fff;
        transition: transform 0.45s ease, box-shadow 0.2s;
      }
      .list li:last-child { border-bottom: none; }
      .list li.dragging { position: relative; z-index: 1; box-shadow: 0 8px 24px rgba(99, 102, 241, 0.18); }
      .op { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      .handle { font-size: 16px; color: #cbd5e1; transition: color 0.2s; }
      .dragging .handle { color: #6366f1; }
      .body { display: flex; flex: 1; flex-direction: column; gap: 2px; min-width: 0; }
      .content { font-size: 15px; color: #1e293b; word-break: break-all; }
      .done .content { color: #94a3b8; text-decoration: line-through; }
      .meta { font-size: 12px; color: #94a3b8; }
      .extra { display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 12px; }
      .x-repeat { color: #db2777; white-space: nowrap; }
      .x-time { color: #0d9488; white-space: nowrap; }
      .x-place { color: #6366f1; word-break: break-all; }
      .body input.edit {
        width: 100%;
        height: 24px;
        padding: 0 7px;
        border: 1px solid #6366f1;
        border-radius: 8px;
        box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.1);
        outline: none;
        color: #1e293b;
        font: inherit;
        font-size: 15px;
      }
      .acts { display: grid; grid-template-columns: repeat(4, auto); place-items: center; gap: 0 2px; }
      .act { display: inline-flex; padding: 6px; font-size: 20px; color: #94a3b8; transition: color 0.2s, transform 0.2s; }
      .act.hot { transform: scale(1.15); }
      .act-check.hot, .act-undo.hot { color: #22c55e; }
      .act-edit.hot, .act-move.hot, .act-place.hot, .act-place.set { color: #6366f1; }
      .act-time.hot, .act-time.set { color: #0d9488; }
      .act-repeat.set { color: #db2777; }
      .act-del.hot { color: #ef4444; }
      .dot {
        flex-shrink: 0;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--dot);
        box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.12);
      }
      .list li:nth-child(7n + 1) { --dot: #ff0000; }
      .list li:nth-child(7n + 2) { --dot: #ff7f00; }
      .list li:nth-child(7n + 3) { --dot: #ffff00; }
      .list li:nth-child(7n + 4) { --dot: #7fff00; }
      .list li:nth-child(7n + 5) { --dot: #007fff; }
      .list li:nth-child(7n + 6) { --dot: #0000ff; }
      .list li:nth-child(7n + 7) { --dot: #7f00ff; }
      .list li.compact .act, .list li.compact .meta { display: none; }
      .notice {
        position: absolute;
        z-index: 4;
        top: 8px;
        left: 10px;
        right: 10px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.97);
        box-shadow: 0 12px 32px rgba(15, 23, 42, 0.2);
        opacity: 0;
        transform: translateY(-14px);
        transition: opacity 0.3s, transform 0.3s;
        pointer-events: none;
      }
      .notice.show { opacity: 1; transform: none; }
      .notice img { width: 32px; height: 32px; border-radius: 8px; }
      .notice b { display: block; font-size: 12px; }
      .notice span { font-size: 12px; color: #475569; }
      .rank {
        margin-bottom: 18px;
        padding: 12px 14px 10px;
        border: 1px solid #eef0f5;
        border-radius: 14px;
        background: linear-gradient(135deg, #fff 0%, #fafaff 100%);
      }
      .rank-head { display: flex; align-items: center; gap: 8px; }
      .rank-badge { font-size: 18px; color: var(--rank-color); transition: color 0.3s; }
      .rank-name { font-size: 15px; font-weight: 700; color: var(--rank-color); transition: color 0.3s; }
      .rank-stars { display: flex; align-items: center; gap: 2px; margin-left: auto; color: #f59e0b; font-size: 14px; }
      .rank-stars .off { color: #e2e8f0; }
      .bar { height: 6px; margin: 8px 0 6px; border-radius: 100px; background: rgba(0, 0, 0, 0.06); overflow: hidden; }
      .bar i { display: block; height: 100%; border-radius: 100px; background: var(--rank-color); transition: width 0.6s ease, background 0.3s; }
      .bar.reset i { transition: none; }
      .rank-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; font-size: 12px; color: #94a3b8; }
      .toast {
        position: fixed;
        z-index: 8;
        top: 8px;
        left: 50%;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 12px;
        border-radius: 10px;
        background: #fff;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08), 0 3px 6px -4px rgba(0, 0, 0, 0.12), 0 9px 28px 8px rgba(0, 0, 0, 0.05);
        color: rgba(0, 0, 0, 0.88);
        font-size: 14px;
        white-space: nowrap;
        opacity: 0;
        transform: translate(-50%, -8px);
        transition: opacity 0.25s, transform 0.25s;
        pointer-events: none;
      }
      .toast .ai { font-size: 16px; color: #52c41a; }
      .toast.show { opacity: 1; transform: translate(-50%, 0); }
      .coin-burst { position: fixed; z-index: 10; width: 0; height: 0; pointer-events: none; }
      .coin {
        position: absolute;
        width: 18px;
        height: 18px;
        margin: -9px 0 0 -9px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #fffbeb 0 12%, #fde047 35%, #f59e0b 75%, #b45309 100%);
        box-shadow: inset 0 0 0 1.5px #d97706, 0 2px 4px rgba(120, 53, 15, 0.3);
      }
      .coin::after {
        content: "";
        position: absolute;
        inset: 4px;
        border: 1.5px solid rgba(180, 83, 9, 0.55);
        border-radius: 50%;
      }
      .rules {
        padding: 16px;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 20px 50px -12px rgba(79, 70, 229, 0.12);
      }
      .rules p { margin: 0 0 12px; text-align: center; font-size: 13px; line-height: 1.7; color: #475569; }
      .tier {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 7px 4px;
        border-bottom: 1px solid #f1f5f9;
        font-size: 13px;
      }
      .tier b { color: var(--tier); }
      .tier span { font-size: 12px; color: #94a3b8; }
      .kings { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 12px; }
      .kings span { padding: 3px 9px; border-radius: 999px; background: #fef2f2; color: #dc2626; font-size: 12px; }
      .popover {
        position: absolute;
        z-index: 2;
        padding: 12px;
        border-radius: 10px;
        background: #fff;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08), 0 3px 6px -4px rgba(0, 0, 0, 0.12), 0 9px 28px 8px rgba(0, 0, 0, 0.05);
        color: rgba(0, 0, 0, 0.88);
        font-size: 14px;
        opacity: 0;
        transform: translateY(-6px);
        pointer-events: none;
        transition: opacity 0.25s, transform 0.25s;
      }
      .popover.show { opacity: 1; transform: none; }
      .popover::before {
        content: "";
        position: absolute;
        top: -4px;
        left: var(--arrow, 50%);
        width: 8px;
        height: 8px;
        margin-left: -4px;
        background: #fff;
        box-shadow: -2px -2px 5px rgba(0, 0, 0, 0.06);
        transform: rotate(45deg);
      }
      .editor { display: flex; flex-direction: column; gap: 8px; }
      .field {
        display: flex;
        align-items: center;
        gap: 4px;
        height: 32px;
        padding: 4px 11px;
        border: 1px solid #6366f1;
        border-radius: 10px;
        box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.1);
      }
      .field input { flex: 1; min-width: 0; padding: 0; border: none; outline: none; background: none; color: inherit; font: inherit; }
      .field input::placeholder { color: rgba(0, 0, 0, 0.25); }
      .pop-buttons { display: flex; justify-content: flex-end; gap: 6px; }
      .btn-primary, .btn-danger { height: 24px; padding: 0 7px; border-radius: 8px; font-size: 14px; line-height: 24px; }
      .btn-primary { background: #6366f1; color: #fff; }
      .btn-danger { color: #ff4d4f; }
      .checks { display: grid; grid-template-columns: repeat(4, 1fr); row-gap: 6px; }
      .check { display: inline-flex; align-items: center; gap: 8px; }
      .check i {
        position: relative;
        width: 16px;
        height: 16px;
        border: 1px solid #d9d9d9;
        border-radius: 6px;
        transition: background 0.2s, border-color 0.2s;
      }
      .check.on i { border-color: #6366f1; background: #6366f1; }
      .check.on i::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 4.5px;
        width: 4px;
        height: 8px;
        border: 2px solid #fff;
        border-top: 0;
        border-left: 0;
        transform: rotate(45deg);
      }
      .pop-hint { margin: 0; font-size: 12px; line-height: 1.5; color: #64748b; }
      .cal-head { display: flex; justify-content: space-between; align-items: center; padding: 4px 0 8px; }
      .cal-title { font-size: 14px; font-weight: 600; color: #334155; }
      .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; }
      .cal-grid i { font-style: normal; line-height: 24px; }
      .cal-grid b { display: flex; justify-content: center; padding: 4px 0; font-weight: 400; }
      .cal-grid b span {
        min-width: 24px;
        height: 24px;
        border: 1px solid transparent;
        border-radius: 6px;
        line-height: 22px;
        transition: background 0.2s, color 0.2s;
      }
      .cal-grid b.out { color: rgba(0, 0, 0, 0.25); }
      .cal-grid b.today span { border-color: #6366f1; }
      .cal-grid b.pick span { background: #6366f1; color: #fff; }
      .cursor {
        position: absolute;
        z-index: 5;
        top: 0;
        left: 0;
        width: 18px;
        height: 18px;
        margin: -2px 0 0 -2px;
        border-radius: 50%;
        background: rgba(99, 102, 241, 0.18);
        border: 2px solid #6366f1;
        transform: translate(-40px, -40px);
        transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
        pointer-events: none;
      }
      .cursor.down { background: rgba(99, 102, 241, 0.45); }
      .caption { margin-top: 14px; text-align: center; }
      .dots { display: flex; justify-content: center; gap: 6px; margin-bottom: 8px; }
      .dots i { width: 7px; height: 7px; border-radius: 50%; background: #ddd6fe; }
      .dots i.on { background: #6366f1; }
      .caption p { min-height: 22px; margin: 0; font-size: 14px; color: #475569; }
      .controls { margin-top: 10px; text-align: center; }
      .controls button {
        border: none;
        background: none;
        color: #6366f1;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }

      .section { margin-top: 40px; }
      h2 { margin: 0 0 12px; text-align: center; font-size: 18px; color: #334155; }
      .platforms { display: flex; justify-content: center; gap: 8px; margin-bottom: 14px; }
      .platforms button {
        padding: 6px 14px;
        border: 1px solid #ddd6fe;
        border-radius: 999px;
        background: #fff;
        color: #64748b;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      .platforms button.on { border-color: #6366f1; background: #6366f1; color: #fff; }
      .phone-stage { position: relative; width: 260px; margin: 0 auto; }
      .phone {
        position: relative;
        height: 520px;
        border: 10px solid #1e293b;
        border-radius: 38px;
        background: #f8fafc;

      }

        font-weight: 600;

      }

      .browser { display: flex; flex-direction: column; padding-top: 28px; background: #f1f5f9; }

        z-index: 3;

        background: #f1f5f9;

        align-items: center;

      .sheet-row.hot, .dropdown div.hot { background: #e0e7ff; }
      .dropdown {
        inset: 64px 8px auto auto;
        z-index: 3;
        width: 150px;

      function svg(name, cls = "") {
        const [viewBox, ...paths] = ICON_SVG[name];
        return `<svg class="ai ${cls}" viewBox="${viewBox}" aria-hidden="true">${paths.map((d) => `<path d="${d}" />`).join("")}</svg>`;

      function tabs(active, counts) {

        [...$("tabs").children].forEach((button, i) => {

      // Same buttons, order and colors as components/TodoList.tsx.
      function task(text, meta, options = {}) {
        const acts = ["edit", "place", "time", "repeat", "move", options.done ? "undo" : "check", "del"];
        const set = { place: options.place, time: options.time, repeat: options.repeat };
        const extra = [
          options.repeat && `<span class="x-repeat">${svg("repeat")} ${options.repeat}</span>`,
          options.time && `<span class="x-time">${svg("time")} ${options.time}</span>`,
          options.place && `<span class="x-place">${svg("place")} ${options.place}</span>`,
        ].filter(Boolean);
        return `<li class="${options.done ? "done" : ""} ${options.cls || ""}" ${options.id ? `id="${options.id}"` : ""}>
          <div class="op">
            ${svg("holder", "handle")}
            <div class="body">
              <span class="content">${text}</span>
              ${extra.length ? `<span class="extra">${extra.join("")}</span>` : ""}
              <span class="meta">${meta}</span>
            </div>
            <div class="acts"><span class="dot"></span>${acts
              .map((a) => `<span class="act act-${a} ${set[a] ? "set" : ""}" data-act="${a}">${svg(a)}</span>`)
              .join("")}</div>
          </div>
        </li>`;
      }

      const firstTask = () => $("groups").querySelector("li");

      /** Taps one of a task's buttons, leaving it highlighted like the app's hover state. */
      async function press(item, name) {
        const icon = item.querySelector(`[data-act="${name}"]`);
        icon.classList.add("hot");
        await tap(icon);
        return icon;
      }

      /** Shows an antd-style popover centered under `anchor`, kept inside the stage. */
      function openPopover(anchor, html) {
        const pop = $("popover");
        const box = anchor.getBoundingClientRect();
        const stage = $("stage").getBoundingClientRect();
        pop.innerHTML = html;
        const center = box.left - stage.left + box.width / 2;
        const left = Math.min(Math.max(8, center - pop.offsetWidth / 2), stage.width - pop.offsetWidth - 8);
        pop.style.top = `${box.bottom - stage.top + 10}px`;
        pop.style.left = `${left}px`;
        pop.style.setProperty("--arrow", `${center - left}px`);
        pop.classList.add("show");
      }

      const closePopover = () => $("popover").classList.remove("show");

      const popButtons = () => `<div class="pop-buttons"><span class="btn-primary" id="popSave">${t().ui.save}</span></div>`;

      async function fillPlace(anchor, value) {
        openPopover(
          anchor,
          `<div class="editor" style="width: 240px">
            <label class="field">${svg("place")}<input readonly placeholder="${t().ui.locationPlaceholder}" /></label>
            ${popButtons()}
          </div>`,
        );
        const input = $("popover").querySelector("input");
        await sleep(500);
        for (const char of value) {
          input.value += char;
          await sleep(110);
        }
        await tap($("popSave"));
        closePopover();
      }

      async function fillTime(anchor, value) {
        openPopover(
          anchor,
          `<div class="editor" style="width: 240px">
            <label class="field"><input type="time" readonly /></label>
            ${popButtons()}
          </div>`,
        );
        await sleep(900);
        $("popover").querySelector("input").value = value;
        await sleep(400);
        await tap($("popSave"));
        closePopover();
      }

      let bellOn = false;
      function setBell(on) {
        bellOn = on;
        $("bell").innerHTML = `${svg(on ? "bellFilled" : "bell", on ? "bell-on" : "")}<span>${t().ui.bell[on ? 1 : 0]}</span>`;
      }

      // Same ladder as lib/rank.ts: 10 points a task, 50 points a star.
      const TIERS = [
        { divisions: 3, stars: 3, color: "#b45309" },
        { divisions: 3, stars: 3, color: "#64748b" },
        { divisions: 4, stars: 4, color: "#d97706" },
        { divisions: 4, stars: 4, color: "#0d9488" },
        { divisions: 5, stars: 5, color: "#4f46e5" },
        { divisions: 5, stars: 5, color: "#9333ea" },
      ];
      const KING_FROM = [0, 10, 20, 30, 40, 50, 100];
      const KING_COLOR = "#dc2626";
      const ROMAN = ["I", "II", "III", "IV", "V"];
      const DEMO_POINTS = 890;
      let points = DEMO_POINTS;

      function getRank(value) {
        const names = t().rank;
        const totalStars = Math.floor(value / 50);
        const fraction = (value % 50) / 50;
        const ladder = TIERS.flatMap((tier, tierIndex) =>
          Array.from({ length: tier.divisions }, (_, i) => ({
            name: `${names.tiers[tierIndex]} ${ROMAN[tier.divisions - 1 - i]}`,
            color: tier.color,
            stars: tier.stars,
          })),
        );
        let remaining = totalStars;
        for (const [index, division] of ladder.entries()) {
          if (remaining < division.stars) {
            return {
              name: division.name,
              color: division.color,
              stars: remaining,
              maxStars: division.stars,
              progress: (remaining + fraction) / division.stars,
              next: ladder[index + 1]?.name ?? names.kings[0],
              toNext: 50 - (value % 50),
            };
          }
          remaining -= division.stars;
        }
        const title = KING_FROM.findLastIndex((from) => remaining >= from);
        const nextFrom = KING_FROM[title + 1];
        return {
          name: names.kings[title],
          color: KING_COLOR,
          stars: remaining,
          maxStars: null,
          progress: nextFrom === undefined ? fraction : (remaining - KING_FROM[title] + fraction) / (nextFrom - KING_FROM[title]),
          next: names.kings[title + 1] ?? null,
          toNext: 50 - (value % 50),
        };
      }

      function renderRank(progressOverride) {
        const rank = getRank(points);
        $("rank").style.setProperty("--rank-color", rank.color);
        $("rankName").textContent = rank.name;
        $("rankStars").innerHTML =
          rank.maxStars === null
            ? `${svg("star")} × ${rank.stars}`
            : Array.from({ length: rank.maxStars }, (_, i) => (i < rank.stars ? svg("star") : svg("starOutlined", "off"))).join("");
        $("rankBar").firstElementChild.style.width = `${Math.round((progressOverride ?? rank.progress) * 100)}%`;
        $("rankFoot").innerHTML =
          `<span>${t().rank.toNextStar(Math.ceil(rank.toNext / 10), points)}</span>` + (rank.next ? `<span>${t().rank.next(rank.next)}</span>` : "");
        return rank;
      }

      /** Jumps the progress bar without animating, e.g. from full back to empty after a promotion. */
      function resetBar() {
        $("rankBar").classList.add("reset");
        renderRank();
        $("rankBar").offsetWidth;
        $("rankBar").classList.remove("reset");
      }

      let toastTimer;
      /** Same look as antd's message.success. */
      function toast(text) {
        $("toast").innerHTML = `${svg("checkFilled")}<span>${text}</span>`;
        $("toast").classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => $("toast").classList.remove("show"), 1800);
      }

      // Same burst as lib/coinBurst.ts.
      function burstCoins(origin) {
        const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
        const count = reduced ? 5 : 14;
        const reach = reduced ? 0.45 : 1;
        const box = origin.getBoundingClientRect();
        const layer = document.createElement("div");
        layer.className = "coin-burst";
        layer.style.left = `${box.left + box.width / 2}px`;
        layer.style.top = `${box.top + box.height / 2}px`;
        document.body.append(layer);
        const animations = Array.from({ length: count }, () => {
          const coin = document.createElement("span");
          coin.className = "coin";
          layer.append(coin);
          const angle = ((-90 + (Math.random() - 0.5) * 110) * Math.PI) / 180;
          const speed = (480 + Math.random() * 300) * Math.sqrt(reach);
          const spin = reduced ? 0 : (720 + Math.random() * 720) * (Math.random() < 0.5 ? -1 : 1);
          const size = 0.75 + Math.random() * 0.45;
          const duration = 900 + Math.random() * 400;
          const keyframes = Array.from({ length: 13 }, (_, i) => {
            const p = i / 12;
            const s = (p * duration) / 1000;
            const x = Math.cos(angle) * speed * s;
            const y = Math.sin(angle) * speed * s + (1400 * reach * s * s) / 2;
            return {
              offset: p,
              opacity: p < 0.7 ? 1 : 1 - (p - 0.7) / 0.3,
              transform: `translate(${x}px, ${y}px) rotateY(${spin * p}deg) scale(${size * Math.min(1, 0.3 + p * 5)})`,
            };
          });
          return coin.animate(keyframes, { duration, easing: "linear", fill: "forwards" });
        });
        Promise.all(animations.map((animation) => animation.finished)).finally(() => layer.remove());
      }

      function renderRules() {
        const names = t().rank;
        $("tiers").innerHTML = TIERS.map(
          (tier, i) => `<div class="tier" style="--tier: ${tier.color}"><b>${names.tiers[i]}</b><span>${names.tierInfo(tier.divisions, tier.stars)}</span></div>`,
        ).join("");
        $("kings").innerHTML = names.kings.map((name, i) => `<span>${name} · ${names.kingFrom(KING_FROM[i])}</span>`).join("");
      }

      function group(label, detail, count, items, options = {}) {
        const open = options.open !== false;
        return `<section class="group">
          <button type="button" class="day" ${options.id ? `id="${options.id}"` : ""}>
            ${options.arrow ? svg("right", `day-arrow ${open ? "open" : ""}`) : ""}
            <span class="day-label">${label}</span>${detail ? `<span class="day-detail">${detail}</span>` : ""}<span class="day-count">${count}</span>
          </button>
          ${open ? `<ul class="list">${items}</ul>` : ""}
        </section>`;
      }

      function pointAt(el, stageId = "stage", cursorId = "cursor") {
        const stage = $(stageId).getBoundingClientRect();
        const box = el.getBoundingClientRect();
        $(cursorId).style.transform = `translate(${box.left - stage.left + box.width / 2}px, ${box.top - stage.top + box.height / 2}px)`;
      }

      async function tap(el, stageId, cursorId) {
        const cursor = $(cursorId || "cursor");
        pointAt(el, stageId, cursorId);
        await sleep(600);
        cursor.classList.add("down");
        await sleep(140);
        cursor.classList.remove("down");
      }

      async function sceneAdd() {
        const ui = t().ui;
        points = DEMO_POINTS;
        resetBar();
        setBell(false);
        $("notice").classList.remove("show");
        $("task").value = "";
        $("add").disabled = true;
        closePopover();
        tabs(0, [0, 0, 0]);
        $("groups").innerHTML = group(ui.today, ui.day(7), 0, "");
        pointAt($("task"));
        await sleep(500);
        for (const char of ui.tasks.book) {
          $("task").value += char;
          $("add").disabled = false;
          await sleep(90);
        }
        await tap($("add"));
        $("task").value = "";
        $("add").disabled = true;
        tabs(0, [1, 0, 0]);
        $("groups").innerHTML = group(ui.today, ui.day(7), 1, task(ui.tasks.book, ui.added("14:06")));
        await sleep(1100);
      }

      async function sceneDone() {
        const ui = t().ui;
        const item = firstTask();
        burstCoins(await press(item, "check"));
        item.classList.add("done");
        const before = getRank(points);
        points += 10;
        const after = getRank(points);
        const starUp = Math.floor(points / 50) > Math.floor((points - 10) / 50);
        if (after.name !== before.name) {
          renderRank(1);
          await sleep(650);
          resetBar();
          toast(t().rank.promoted(after.name));
        } else {
          renderRank();
          if (starUp) toast(t().rank.starUp);
        }
        await sleep(1500);
        tabs(1, [0, 1, 0]);
        $("groups").innerHTML = group(
          ui.today,
          ui.day(7),
          1,
          task(ui.tasks.book, `${ui.added("14:06")} · ${ui.done("14:07")}`, { done: true }),
        );
        await sleep(1000);
      }

      async function sceneUndo() {
        const ui = t().ui;
        await press(firstTask(), "undo");
        points -= 10;
        resetBar();
        tabs(0, [1, 0, 0]);
        $("groups").innerHTML = group(ui.today, ui.day(7), 1, task(ui.tasks.book, ui.added("14:06")));
        await sleep(1600);
      }

      async function sceneEdit() {
        const ui = t().ui;
        tabs(0, [1, 0, 0]);
        $("groups").innerHTML = group(ui.today, ui.day(7), 1, task(ui.tasks.milk, ui.added("09:30")));
        await sleep(400);
        const icon = await press(firstTask(), "edit");
        const input = document.createElement("input");
        input.className = "edit";
        input.readOnly = true;
        input.value = ui.tasks.milk;
        firstTask().querySelector(".content").replaceWith(input);
        await sleep(400);
        for (const char of ui.tasks.milkMore) {
          input.value += char;
          await sleep(110);
        }
        await sleep(500);
        icon.classList.remove("hot");
        $("groups").innerHTML = group(ui.today, ui.day(7), 1, task(input.value, ui.added("09:30")));
        await sleep(1200);
      }

      async function sceneDetails() {
        const ui = t().ui;
        const name = ui.tasks.milk + ui.tasks.milkMore;
        const render = (details) => {
          $("groups").innerHTML = group(ui.today, ui.day(7), 1, task(name, ui.added("09:30"), details));
          return firstTask();
        };
        tabs(0, [1, 0, 0]);
        let item = render({});
        await sleep(300);
        await fillPlace(await press(item, "place"), ui.place);
        item = render({ place: ui.place });
        await sleep(700);
        await fillTime(await press(item, "time"), "18:30");
        render({ time: "18:30", place: ui.place });
        await sleep(1500);
      }

      async function sceneRepeat() {
        const ui = t().ui;
        const name = ui.tasks.english;
        // Today (Oct 7) is a Wednesday, so Wednesday starts ticked and Friday gets a copy this week.
        const [wed, fri] = [3, 5];
        tabs(0, [1, 0, 0]);
        $("groups").innerHTML = group(ui.today, ui.day(7), 1, task(name, ui.added("08:00"), { time: "19:00" }));
        await sleep(400);
        const icon = await press(firstTask(), "repeat");
        openPopover(
          icon,
          `<div class="editor" style="width: 260px">
            <div class="checks">${ui.repeatDays
              .map((d, i) => `<span class="check ${i + 1 === wed ? "on" : ""}" data-day="${i + 1}"><i></i>${d}</span>`)
              .join("")}</div>
            <p class="pop-hint">${ui.repeatHint}</p>
            ${popButtons()}
          </div>`,
        );
        await sleep(700);
        const friday = $("popover").querySelector(`[data-day="${fri}"]`);
        await tap(friday.firstElementChild);
        friday.classList.add("on");
        await sleep(400);
        await tap($("popSave"));
        closePopover();
        const text = ui.repeatText([ui.repeatDays[wed - 1], ui.repeatDays[fri - 1]]);
        toast(ui.repeatSaved(text));
        const details = { repeat: text, time: "19:00" };
        const today = group(ui.today, ui.day(7), 1, task(name, ui.added("08:00"), details));
        tabs(0, [2, 0, 0]);
        $("groups").innerHTML = today + group(ui.dated(9), "", 1, "", { arrow: true, open: false, id: "fri" });
        await sleep(1000);
        await tap($("fri"));
        $("groups").innerHTML =
          today + group(ui.dated(9), "", 1, task(name, ui.added(`${ui.day(7)} 14:08`), details), { arrow: true, id: "fri" });
        await sleep(1600);
      }

      async function notify(title, body, ms) {
        $("noticeTitle").textContent = title;
        $("noticeBody").textContent = body;
        $("notice").classList.add("show");
        await sleep(ms);
        $("notice").classList.remove("show");
        await sleep(400);
      }

      async function sceneRemind() {
        const ui = t().ui;
        const name = ui.tasks.milk + ui.tasks.milkMore;
        tabs(0, [1, 0, 0]);
        $("groups").innerHTML = group(ui.today, ui.day(7), 1, task(name, ui.added("09:30"), { time: "18:30", place: ui.place }));
        await sleep(400);
        $("bell").classList.add("hot");
        await tap($("bell"));
        $("bell").classList.remove("hot");
        setBell(true);
        await sleep(500);
        // Turning reminders on sends a test notification first.
        await notify(ui.enabledTitle, ui.enabledBody, 2200);
        $("cursor").style.transform = "translate(-40px, -40px)";
        await sleep(900);
        await notify(ui.startsIn, `18:30 ${name} · ${ui.place}`, 2600);
      }

      async function sceneDrag() {
        const ui = t().ui;
        tabs(0, [2, 0, 0]);
        $("groups").innerHTML = group(
          ui.today,
          ui.day(7),
          2,
          task(ui.tasks.milk, ui.added("09:30"), { id: "a" }) + task(ui.tasks.dentist, ui.added("11:10"), { id: "b" }),
        );
        await sleep(400);
        const grip = $("b").querySelector(".body");
        const cursor = $("cursor");
        pointAt(grip);
        await sleep(600);
        cursor.classList.add("down");
        await sleep(450);
        const shift = $("b").offsetHeight;
        $("b").classList.add("dragging");
        $("b").style.transform = `translateY(-${shift}px)`;
        cursor.style.transform = cursor.style.transform.replace(/,\s*([\d.-]+)px\)/, (_, y) => `, ${y - shift}px)`);
        await sleep(700);
        $("a").style.transform = `translateY(${shift}px)`;
        await sleep(500);
        cursor.classList.remove("down");
        $("b").classList.remove("dragging");
        $("b").style.transform = "";
        $("a").style.transform = "";
        $("groups").querySelector(".list").insertBefore($("b"), $("a"));
        await sleep(900);
      }

      async function sceneRainbow() {
        const ui = t().ui;
        const names = ui.tasks.rainbow;
        $("cursor").style.transform = "translate(-40px, -40px)";
        let items = "";
        for (const [i, name] of names.entries()) {
          items += task(name, "", { cls: "compact" });
          tabs(0, [i + 1, 0, 0]);
          $("groups").innerHTML = group(ui.today, ui.day(7), i + 1, items);
          await sleep(260);
        }
        await sleep(2200);
      }

      async function sceneMove() {
        const ui = t().ui;
        tabs(0, [1, 0, 0]);
        $("groups").innerHTML = group(ui.today, ui.day(7), 1, task(ui.tasks.milk, ui.added("09:30")));
        // antd's mini Calendar: six weeks with September and November days greyed out, the task's own day selected.
        const offset = ui.firstDayOffset;
        const cells = [
          ...Array.from({ length: offset }, (_, i) => ({ day: 30 - offset + 1 + i, out: true })),
          ...Array.from({ length: 31 }, (_, i) => ({ day: i + 1 })),
          ...Array.from({ length: 42 - 31 - offset }, (_, i) => ({ day: i + 1, out: true })),
        ];
        const cell = ({ day, out }) => {
          if (out) return `<b class="out"><span>${day}</span></b>`;
          return `<b class="${day === 7 ? "today pick" : ""}" id="day${day}"><span>${day}</span></b>`;
        };
        await sleep(300);
        openPopover(
          await press(firstTask(), "move"),
          `<div style="width: 300px">
            <div class="cal-head">
              <span class="tbtn square">${svg("left")}</span>
              <span class="cal-title">${ui.month}</span>
              <span class="tbtn square">${svg("right")}</span>
            </div>
            <div class="cal-grid">${ui.weekdays.map((day) => `<i>${day}</i>`).join("")}${cells.map(cell).join("")}</div>
          </div>`,
        );
        await sleep(500);
        await tap($("day8").firstElementChild);
        $("day7").classList.remove("pick");
        $("day8").classList.add("pick");
        await sleep(250);
        closePopover();
        toast(ui.movedTo(8));
        tabs(0, [1, 0, 0]);
        $("groups").innerHTML = group(ui.tomorrow, ui.day(8), 1, task(ui.tasks.milk, ui.added(`${ui.day(7)} 09:30`)));
        await sleep(1200);
      }

      async function sceneFold() {
        const ui = t().ui;
        tabs(0, [3, 0, 0]);
        const today = group(ui.today, ui.day(7), 1, task(ui.tasks.report, ui.added("09:30")));
        const yesterday = task(ui.tasks.dentist, ui.added("15:00")) + task(ui.tasks.bike, ui.added("18:45"));
        $("groups").innerHTML = today + group(ui.yesterday, ui.day(6), 2, "", { arrow: true, open: false, id: "y" });
        await sleep(600);
        await tap($("y"));
        $("groups").innerHTML = today + group(ui.yesterday, ui.day(6), 2, yesterday, { arrow: true, id: "y" });
        await sleep(1400);
      }

      // In the same order as the captions in I18N steps.
      const SCENES = [sceneAdd, sceneDone, sceneUndo, sceneEdit, sceneDetails, sceneRepeat, sceneRemind, sceneDrag, sceneRainbow, sceneMove, sceneFold];

      async function play() {
        const run = ++token;
        while (run === token) {
          for (const [index, scene] of SCENES.entries()) {
            caption(index);
            await scene();
            if (run !== token) return;
          }
        }
      }

      $("replay").addEventListener("click", play);

      const LAYERS = ["sheet", "dropdown", "dialogIos", "dialogAndroid", "home", "standalone"];
      let os = "ios";
      let installToken = 0;
      let installStep = 0;

      function installCaption(index) {
        installStep = index;
        const steps = t().installSteps[os];
        $("installDots").innerHTML = steps.map((_, i) => `<i class="${i === index ? "on" : ""}"></i>`).join("");
        $("installCaption").textContent = steps[index];
      }

      const show = (id) => $(id).classList.remove("hidden");
      const hide = (id) => $(id).classList.add("hidden");
      const phoneTap = (id) => tap($(id), "phoneStage", "phoneCursor");

      function resetPhone() {
        LAYERS.forEach(hide);
        hide("appIcon");
        ["addHome", "installItem"].forEach((id) => $(id).classList.remove("hot"));
        $("toolbar").style.display = os === "ios" ? "" : "none";
        $("menu").style.visibility = os === "android" ? "visible" : "hidden";
      }

      async function installOnce(run) {
        resetPhone();
        installCaption(0);
        await sleep(700);
        if (os === "ios") {
          await phoneTap("share");
          show("sheet");
          await sleep(900);
          if (run !== installToken) return;
          installCaption(1);
          await phoneTap("addHome");
          $("addHome").classList.add("hot");
          await sleep(300);
          hide("sheet");
          show("dialogIos");
          await sleep(800);
          if (run !== installToken) return;
          installCaption(2);
          await phoneTap("iosAdd");
          hide("dialogIos");
        } else {
          await phoneTap("menu");
          show("dropdown");
          await sleep(900);
          if (run !== installToken) return;
          installCaption(1);
          await phoneTap("installItem");
          $("installItem").classList.add("hot");
          await sleep(300);
          hide("dropdown");
          show("dialogAndroid");
          await sleep(800);
          if (run !== installToken) return;
          installCaption(2);
          await phoneTap("androidInstall");
          hide("dialogAndroid");
        }
        if (run !== installToken) return;
        installCaption(3);
        show("home");
        await sleep(500);
        show("appIcon");
        await sleep(900);
        await phoneTap("appIcon");
        if (run !== installToken) return;
        show("standalone");
        await sleep(2000);
      }

      async function playInstall() {
        const run = ++installToken;
        while (run === installToken) await installOnce(run);
      }

      $("platforms").addEventListener("click", (event) => {
        const button = event.target.closest("button");
        if (!button || button.dataset.os === os) return;
        os = button.dataset.os;
        [...$("platforms").children].forEach((b) => b.classList.toggle("on", b === button));
        playInstall();
      });

      function applyLang() {
        document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
        document.title = t().pageTitle;
        document.querySelectorAll("[data-i18n]").forEach((el) => (el.textContent = t()[el.dataset.i18n]));
        document.querySelectorAll("[data-i18n-html]").forEach((el) => (el.innerHTML = withIcons(t()[el.dataset.i18nHtml])));
        $("lang").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.lang === lang));
        $("task").placeholder = t().ui.placeholder;
        $("add").innerHTML = `${svg("plus")}<span>${t().ui.add}</span>`;
        tabs(...lastTabs);
        setBell(bellOn);
        renderRank();
        renderRules();
        caption(step);
        installCaption(installStep);
      }

      $("lang").addEventListener("click", (event) => {
        const button = event.target.closest("button");
        if (!button || button.dataset.lang === lang) return;
        lang = button.dataset.lang;
        localStorage.setItem("guide-lang", lang);
        applyLang();
      });

      document.querySelectorAll("[data-icon]").forEach((el) => (el.outerHTML = svg(el.dataset.icon, el.className)));
      applyLang();
      play();
      playInstall();
    </script>
  </body>
</html>
